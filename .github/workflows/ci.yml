name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/**'
      - 'cl_questions_before_finetune/**'
      - 'cobol_questions_before_finetune/**'
      - 'rpgle_questions_before_finetune/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/**'
      - 'cl_questions_before_finetune/**'
      - 'cobol_questions_before_finetune/**'
      - 'rpgle_questions_before_finetune/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      clle: ${{ steps.filter.outputs.clle }}
      cobol: ${{ steps.filter.outputs.cobol }}
      rpgle: ${{ steps.filter.outputs.rpgle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            clle:
              - 'tests/clle/**'
              - 'cl_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            cobol:
              - 'tests/cobol/**'
              - 'cobol_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            rpgle:
              - 'tests/rpgle/**'
              - 'rpgle_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'

  clle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.clle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CLLE .env file
        run: |
          set -euo pipefail
          mkdir -p tests/clle
          cat > tests/clle/.env <<'EOF'
          LANGAGE=clle
          EXTENSION=.clle
          DIR_QUESTIONS=../../cl_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../cl_questions_before_finetune/answer_before_finetune
          DIR_RESULTATS=../results/clle_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=false
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet python-dotenv

      - name: Verify CLLE inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/clle
          test -f tests/clle/.env
          test -d cl_questions_before_finetune/questions_before_finetune

      - name: Run CLLE comparison script
        run: |
          set -euo pipefail
          python3 tests/clle/compare_clle.py

      - name: Publish CLLE results
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/results/clle_test_before_finetune
          git commit -m "ci: update CLLE comparison results" || echo "No changes to commit"
          git push

  cobol-tests:
    needs: changes
    if: ${{ needs.changes.outputs.cobol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create COBOL .env file
        run: |
          set -euo pipefail
          mkdir -p tests/cobol
          cat > tests/cobol/.env <<'EOF'
          LANGAGE=cobol
          EXTENSION=.cbl
          DIR_QUESTIONS=../../cobol_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../cobol_questions_before_finetune/answers_before_finetune
          DIR_RESULTATS=../results/cobol_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=false
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet python-dotenv

      - name: Verify COBOL inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/cobol
          test -f tests/cobol/.env
          test -d cobol_questions_before_finetune/questions_before_finetune

      - name: Run COBOL comparison script
        run: |
          set -euo pipefail
          python3 tests/cobol/compare_cobol.py

      - name: Publish COBOL results
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/results/cobol_test_before_finetune
          git commit -m "ci: update COBOL comparison results" || echo "No changes to commit"
          git push

  rpgle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rpgle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create RPGLE .env file
        run: |
          set -euo pipefail
          mkdir -p tests/rpgle
          cat > tests/rpgle/.env <<'EOF'
          LANGAGE=rpgle
          EXTENSION=.rpgle
          DIR_QUESTIONS=../../rpgle_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../rpgle_questions_before_finetune/answers_before_finetune
          DIR_RESULTATS=../results/rpgle_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=True
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet python-dotenv

      - name: Verify RPGLE inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/rpgle
          test -f tests/rpgle/.env
          test -d rpgle_questions_before_finetune/questions_before_finetune

      - name: Run RPGLE comparison script
        run: |
          set -euo pipefail
          python3 tests/rpgle/compare_rpgle.py

      - name: Publish RPGLE results
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/results/rpgle_test_before_finetune
          git commit -m "ci: update RPGLE comparison results" || echo "No changes to commit"
          git push
