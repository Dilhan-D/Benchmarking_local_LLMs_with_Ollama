name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/**'
      - 'granite_cl_questions_before_finetune/**'
      - 'granite_cobol_questions_before_finetune/**'
      - 'granite_rpgle_questions_before_finetune/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/**'
      - 'granite_cl_questions_before_finetune/**'
      - 'granite_cobol_questions_before_finetune/**'
      - 'granite_rpgle_questions_before_finetune/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      clle: ${{ steps.filter.outputs.clle }}
      cobol: ${{ steps.filter.outputs.cobol }}
      rpgle: ${{ steps.filter.outputs.rpgle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            clle:
              - 'tests/clle/**'
              - 'granite_cl_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            cobol:
              - 'tests/cobol/**'
              - 'granite_cobol_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            rpgle:
              - 'tests/rpgle/**'
              - 'granite_rpgle_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'

  clle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.clle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect changed tests
        id: detect
        run: |
          set -euo pipefail
          # list changed files between commits
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          echo "Changed files: $CHANGED"
          tests=""
          for f in $CHANGED; do
            if [[ "$f" =~ granite_cl_questions_before_finetune/questions_before_finetune/\#([0-9]+)test ]]; then
              tests=",${tests}${BASH_REMATCH[1]}"
            fi
            if [[ "$f" =~ granite_cl_questions_before_finetune/answer_before_finetune/\#result([0-9]+) ]]; then
              tests=",${tests}${BASH_REMATCH[1]}"
            fi
          done
          tests=$(echo "$tests" | sed 's/,\+/,/g' | sed 's/^,//' | tr ',' '\n' | grep -E '^[0-9]+' || true | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "tests=$tests" >> $GITHUB_OUTPUT

      - name: Create CLLE .env file
        run: |
          set -euo pipefail
          mkdir -p tests/clle
          cat > tests/clle/.env <<'EOF'
          LANGAGE=clle
          EXTENSION=.clle
          DIR_QUESTIONS=../../granite_cl_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../granite_cl_questions_before_finetune/answer_before_finetune
          DIR_RESULTATS=../results/granite_clle_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=false
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet python-dotenv

      - name: Verify CLLE inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/clle
          test -f tests/clle/.env
          test -d granite_cl_questions_before_finetune/questions_before_finetune

      - name: Run CLLE comparison script
        env:
          FILTER_TESTS: ${{ steps.detect.outputs.tests }}
        run: |
          set -euo pipefail
          python3 tests/clle/compare_clle.py

      - name: Publish CLLE results
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/results/granite_clle_test_before_finetune
          git commit -m "ci: update CLLE comparison results" || echo "No changes to commit"
          git push

  cobol-tests:
    needs: changes
    if: ${{ needs.changes.outputs.cobol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect changed tests
        id: detect
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          echo "Changed files: $CHANGED"
          tests=""
          for f in $CHANGED; do
            if [[ "$f" =~ granite_cobol_questions_before_finetune/questions_before_finetune/\#([0-9]+)test ]]; then
