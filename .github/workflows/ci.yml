      - name: Verify RPGLE inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/rpgle
          test -f tests/rpgle/.env
          test -d granite_rpgle_questions_before_finetune/questions_before_finetune

      - name: Run RPGLE comparison script
        env:
          FILTER_TESTS: ${{ steps.detect.outputs.tests }}
        run: |
          set -euo pipefail
          python3 tests/rpgle/compare_rpgle.py

      - name: Publish RPGLE results
        if: success()
        run: |
