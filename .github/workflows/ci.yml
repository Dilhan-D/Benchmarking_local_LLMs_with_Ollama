          tests=$(echo "$tests" | sed 's/,\+/,/g' | sed 's/^,//' | tr ',' '\n' | grep -E '^[0-9]+' || true | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "tests=$tests" >> $GITHUB_OUTPUT

      - name: Create COBOL .env file
        run: |
          set -euo pipefail
          mkdir -p tests/cobol
          cat > tests/cobol/.env <<'EOF'
          LANGAGE=cobol
          EXTENSION=.cbl
          DIR_QUESTIONS=../../granite_cobol_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../granite_cobol_questions_before_finetune/answers_before_finetune
          DIR_RESULTATS=../results/granite_cobol_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=false
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet python-dotenv

      - name: Verify COBOL inputs
        run: |
          set -euo pipefail
          pwd
          ls tests/cobol
          test -f tests/cobol/.env
          test -d granite_cobol_questions_before_finetune/questions_before_finetune

      - name: Run COBOL comparison script
        env:
          FILTER_TESTS: ${{ steps.detect.outputs.tests }}
        run: |
          set -euo pipefail
          python3 tests/cobol/compare_cobol.py

      - name: Publish COBOL results
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/results/granite_cobol_test_before_finetune
          git commit -m "ci: update COBOL comparison results" || echo "No changes to commit"
          git push

  rpgle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rpgle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect changed tests
        id: detect
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          echo "Changed files: $CHANGED"
          tests=""
