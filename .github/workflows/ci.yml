            fi
            if [[ "$f" =~ granite_rpgle_questions_before_finetune/answers_before_finetune/\#result([0-9]+) ]]; then
              tests=",${tests}${BASH_REMATCH[1]}"
            fi
          done
          tests=$(echo "$tests" | sed 's/,\+/,/g' | sed 's/^,//' | tr ',' '\n' | grep -E '^[0-9]+' || true | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "tests=$tests" >> $GITHUB_OUTPUT

      - name: Create RPGLE .env file
        run: |
          set -euo pipefail
          mkdir -p tests/rpgle
          cat > tests/rpgle/.env <<'EOF'
          LANGAGE=rpgle
          EXTENSION=.rpgle
          DIR_QUESTIONS=../../granite_rpgle_questions_before_finetune/questions_before_finetune
          DIR_REPONSES=../../granite_rpgle_questions_before_finetune/answers_before_finetune
          DIR_RESULTATS=../results/granite_rpgle_test_before_finetune
          NOM_RAPPORT=synthese_comparaison
          IGNORER_CASSE=false
          IGNORER_ESPACES=True
          IGNORER_LIGNES_VIDES=true
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
