name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/requirements.txt'
      - 'tests/clle/**'
      - 'cl_questions_before_finetune/**'
      - 'tests/cobol/**'
      - 'cobol_questions_before_finetune/**'
      - 'tests/rpgle/**'
      - 'rpgle_questions_before_finetune/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/ci.yml'
      - 'tests/requirements.txt'
      - 'tests/clle/**'
      - 'cl_questions_before_finetune/**'
      - 'tests/cobol/**'
      - 'cobol_questions_before_finetune/**'
      - 'tests/rpgle/**'
      - 'rpgle_questions_before_finetune/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      clle: ${{ steps.filter.outputs.clle }}
      cobol: ${{ steps.filter.outputs.cobol }}
      rpgle: ${{ steps.filter.outputs.rpgle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            clle:
              - 'tests/clle/**'
              - 'cl_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            cobol:
              - 'tests/cobol/**'
              - 'cobol_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'
            rpgle:
              - 'tests/rpgle/**'
              - 'rpgle_questions_before_finetune/**'
              - 'tests/requirements.txt'
              - '.github/workflows/ci.yml'

  clle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.clle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements.txt'

      - name: Install dependencies
        run: |
          py -m pip install -r tests/requirements.txt

      - name: Run CLLE comparison script
        run: |
          py tests/clle/compare_clle.py

  cobol-tests:
    needs: changes
    if: ${{ needs.changes.outputs.cobol == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements.txt'

      - name: Install dependencies
        run: |
          py -m pip install -r tests/requirements.txt

      - name: Run COBOL comparison script
        run: |
          py tests/cobol/compare_cobol.py

  rpgle-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rpgle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements.txt'

      - name: Install dependencies
        run: |
          py -m pip install -r tests/requirements.txt

      - name: Run RPGLE comparison script
        run: |
          py tests/rpgle/compare_rpgle.py
